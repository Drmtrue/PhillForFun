name = "phill-quiz-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

# Single store for facts, questions and scores (SQLite-backed Durable Object, available on the free plan)
[[durable_objects.bindings]]
name = "STORE"
class_name = "QuizStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuizStore"]

[vars]
MODEL = "claude-sonnet-5-5"
FACTS_PER_HOUR_PER_IP = "20"
FACTS_PER_DAY_TOTAL = "100"

# Secrets are set in the Cloudflare dashboard (Settings -> Variables and secrets), not here:
#   AI_API_KEY        - API key for Root AI - model b1t quiz v1.1
#   ADMIN_TOKEN       - any long password for the admin.html page

[observability]
enabled = true
